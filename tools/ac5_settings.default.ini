# Ace Combat 5 recompiled -- settings.
# This is the default template shipped with the launcher.
# The game rewrites this file on exit; the launcher edits it in-place
# and keeps a .launcher.bak copy before every save.

[graphics]
preset                     = 0          ; 0 low, 1 medium, 2 high, 3 ultra, 4 custom
internal_resolution        = 1          ; 0 auto (cover the window), 1 native 640x448, 2..8 times that
texture_filter             = 0          ; 0 as the game asks, 1 force nearest, 2 force bilinear
anisotropy                 = 0          ; 0 off, 2, 4, 8 or 16
deinterlace                = 1          ; 1 weave the two fields into whole frames
scale_filter               = 1          ; 0 nearest, 1 bilinear, 2 sharp bilinear

[postfx]
fxaa                       = 0          ; 1 on
sharpen                    = 0.000000   ; 0..1
brightness                 = 0.000000   ; -0.5..0.5
contrast                   = 1.000000   ; 0.5..1.5
gamma                      = 1.000000   ; 0.5..2.0
saturation                 = 1.000000   ; 0..2

[display]
window_mode                = 0          ; 0 windowed, 1 borderless fullscreen, 2 exclusive fullscreen
fullscreen_type            = 1          ; what F11 enters: 1 borderless, 2 exclusive
window_width               = 1280       ; windowed size in pixels
window_height              = 720
fullscreen_width           = 0          ; exclusive fullscreen; 0 = desktop resolution
fullscreen_height          = 0
fullscreen_refresh         = 0.000000   ; Hz; 0 = desktop refresh rate
aspect                     = 0          ; 0 stretch to window, 1 auto, 2 4:3, 3 16:9, 4 custom
aspect_custom              = 1.777778   ; width / height
integer_scale              = 0          ; 1 whole-number scaling only
widescreen                 = 0          ; 1 apply the 16:9 game patch
hud_layout                 = 1          ; with widescreen: 0 stretch, 1 keep 4:3 centred
present_mode               = 0          ; 0 mailbox, 1 vsync (fifo), 2 immediate, 3 adaptive
fps_limit                  = 0          ; 0 off
show_fps                   = 0          ; 1 on
menu_scale                 = 1.000000   ; 0.5..3

[input]
block_game_input_in_menu   = 1          ; 1 on

[analog]
deadzone                   = 0.000000   ; PCSX2 Analog Deadzone, 0..1
axis_scale                 = 1.330000   ; PCSX2 Analog Sensitivity, 0.01..2
button_deadzone            = 0.000000   ; PCSX2 Button/Trigger Deadzone, 0..1
invert_left                = 0          ; 0 none, 1 left/right, 2 up/down, 3 both
invert_right               = 0          ; 0 none, 1 left/right, 2 up/down, 3 both

[keyboard]
; action = primary secondary, as SDL scancodes (0 = unbound)
select                     = 229   0    ; Right Shift, -
l3                         =   0   0    ; -, -
r3                         =   0   0    ; -, -
start                      =  40   0    ; Return, -
up                         =  82   0    ; Up, -
right                      =  79   0    ; Right, -
down                       =  81   0    ; Down, -
left                       =  80   0    ; Left, -
l2                         =  30   0    ; 1, -
r2                         =  32   0    ; 3, -
l1                         =  20   0    ; Q, -
r1                         =   8   0    ; E, -
triangle                   =   4   0    ; A, -
circle                     =  22   0    ; S, -
cross                      =  27   0    ; X, -
square                     =  29   0    ; Z, -
lstick_up                  =  26  96    ; W, Keypad 8
lstick_down                =  90   0    ; Keypad 2, -
lstick_left                =  92   0    ; Keypad 4, -
lstick_right               =  94   0    ; Keypad 6, -
rstick_up                  =   0   0    ; -, -
rstick_down                =   0   0    ; -, -
rstick_left                =   0   0    ; -, -
rstick_right               =   0   0    ; -, -

[controller]
; action = primary secondary: 1 + SDL button, or 256 | axis << 1 | positive
select                     =   5   0    ; Back / Select, -
l3                         =   8   0    ; Left stick click, -
r3                         =   9   0    ; Right stick click, -
start                      =   7   0    ; Start, -
up                         =  12   0    ; D-pad Up, -
right                      =  15   0    ; D-pad Right, -
down                       =  13   0    ; D-pad Down, -
left                       =  14   0    ; D-pad Left, -
l2                         = 265   0    ; Left trigger, -
r2                         = 267   0    ; Right trigger, -
l1                         =  10   0    ; Left bumper, -
r1                         =  11   0    ; Right bumper, -
triangle                   =   4   0    ; North (Y / Triangle), -
circle                     =   2   0    ; East (B / Circle), -
cross                      =   1   0    ; South (A / Cross), -
square                     =   3   0    ; West (X / Square), -
lstick_up                  = 258   0    ; Left stick Up, -
lstick_down                = 259   0    ; Left stick Down, -
lstick_left                = 256   0    ; Left stick Left, -
lstick_right               = 257   0    ; Left stick Right, -
rstick_up                  = 262   0    ; Right stick Up, -
rstick_down                = 263   0    ; Right stick Down, -
rstick_left                = 260   0    ; Right stick Left, -
rstick_right               = 261   0    ; Right stick Right, -
