name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0-manual)'
        required: true
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04-arm
            target: arm64
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v5
      
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y cmake make ${{ matrix.cc }} pkg-config libvulkan-dev glslang-tools libsdl3-dev glslc wget file libfuse2
          
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPS2_RUNTIME_ONLY=ON 
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          
      - name: Build
        run: cmake --build build --target gsreplay -j$(nproc)
        
      - name: Package Tarball
        run: |
          mkdir -p dist
          cp build/gsreplay dist/
          strip dist/gsreplay
          
          cat > dist/README.txt <<'EOT'
          gsreplay (Linux ${{ matrix.target }})
          
          Requires: SDL3 (libsdl3) and Vulkan Loader (libvulkan).
          Run with: ./gsreplay <capture.gscap> --novideo --bench
          EOT
          
          tar -czvf gsreplay-linux-${{ matrix.target }}.tar.gz -C dist .
          
      - name: Package AppImage (x86_64 only)
        if: matrix.target == 'x86_64'
        run: |
          # Baixa o appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
          
          # Cria a estrutura do AppDir
          mkdir -p AppDir/usr/bin
          cp build/gsreplay AppDir/usr/bin/
          strip AppDir/usr/bin/gsreplay
          
          # Cria o AppRun
          cat > AppDir/AppRun << 'EOT'
          #!/bin/bash
          HERE=$(dirname "$(readlink -f "${0}")")
          exec "${HERE}/usr/bin/gsreplay" "$@"
          EOT
          chmod +x AppDir/AppRun
          
          # Cria o arquivo .desktop
          cat > AppDir/gsreplay.desktop << 'EOT'
          [Desktop Entry]
          Name=gsreplay
          Exec=gsreplay
          Icon=gsreplay
          Type=Application
          Categories=Utility;
          EOT
          
          # Gera um ícone PNG 1x1 básico caso não exista um oficial
          # (Se você tiver um ícone no repo, pode trocar por cp caminho/do/icone.png AppDir/gsreplay.png)
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > AppDir/gsreplay.png
          
          # Gera o AppImage
          ARCH=x86_64 /usr/local/bin/appimagetool AppDir gsreplay-linux-x86_64.AppImage
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            gsreplay-linux-${{ matrix.target }}.tar.gz
            gsreplay-linux-${{ matrix.target }}.AppImage

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          draft: true
