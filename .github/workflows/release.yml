name: gsreplay binaries

# This workflow only builds gsreplay (the replay / benchmark tool) for x86-64 and
# ARM64. It does NOT build the playable game or the AppImage: both need
# generated/, which is derived from the game and cannot exist in CI.
# Playable releases are built locally:
#   bash tools/make_appimage.sh      # EagleFive-x86_64.AppImage
#   bash tools/package.sh vX.Y.Z     # portable tarball
# and published with `gh release create`.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gsreplay:
    name: gsreplay (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
          - os: ubuntu-24.04-arm
            target: arm64
    steps:
      - uses: actions/checkout@v5

      - name: deps
        run: apt-get update && apt-get install -y cmake make clang pkg-config libvulkan-dev glslang-tools libsdl3-dev glslc

      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPS2_RUNTIME_ONLY=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: build
        run: cmake --build build --target gsreplay -j$(nproc)

      - name: package
        run: |
          mkdir -p dist
          cp build/gsreplay dist/
          strip dist/gsreplay
          cat > dist/README.txt <<'EOT'
          gsreplay (replay / benchmark tool), Linux ${{ matrix.target }}

          This is NOT the playable game and has no launcher. For the game, use the
          AppImage or the portable tarball published on the Releases page.
          Requires: SDL3 and the Vulkan loader.
          Usage: ./gsreplay <capture.gscap> --novideo --bench
          EOT
          tar -czf gsreplay-linux-${{ matrix.target }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: gsreplay-linux-${{ matrix.target }}
          path: gsreplay-linux-${{ matrix.target }}.tar.gz
