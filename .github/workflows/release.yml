name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (ex: v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    env:
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias base
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              cmake g++ ninja-build pkg-config \
              libvulkan-dev glslang-tools glslc \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
              libxi-dev libxfixes-dev libxss-dev libxinerama-dev \
              libxtst-dev \
              libwayland-dev libxkbcommon-dev libdecor-0-dev \
              libasound2-dev libpulse-dev libudev-dev \
              libdbus-1-dev libibus-1.0-dev

      - name: Construir SDL3 do source
        run: |
          git clone --depth 1 --branch release-3.4.18 \
              https://github.com/libsdl-org/SDL.git /tmp/SDL
          cd /tmp/SDL
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF \
              -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
              -DSDL_INSTALL_TESTS=OFF \
              -DSDL_KMSDRM=OFF -DSDL_VIVANTE=OFF \
              -DSDL_RPI=OFF -DSDL_ROCKCHIP=OFF \
              -DSDL_X11_XTEST=OFF -DSDL_X11_XSCRNSAVER=OFF \
              -DSDL_X11_XCURSOR=OFF -DSDL_X11_XINERAMA=OFF \
              -DSDL_IBUS=OFF -DSDL_DBUS=OFF -DSDL_LIBUDEV=ON
          cmake --build build -j$(nproc)
          sudo cmake --install build
          sudo ldconfig

      - name: Determinar versao
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
              echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Configurar CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build -j$(nproc)

      - name: Empacotar
        run: ./tools/package.sh ${{ steps.ver.outputs.tag }}

      - name: Upload de artefactos
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          draft: false
