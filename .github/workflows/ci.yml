name: ci
on: [push, pull_request]

permissions:
  contents: read

# A newer push to the same ref supersedes the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (gcc 15, x86-64)
    runs-on: ubuntu-24.04
    container: gcc:15
    steps:
      - uses: actions/checkout@v5
      - name: deps
        run: apt-get update && apt-get install -y cmake pkg-config libvulkan-dev glslang-tools libsdl3-dev glslc python3
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPS2_RUNTIME_ONLY=ON
      - name: build
        run: cmake --build build --target gsreplay -j$(nproc)
      - name: smoke test (binary loads)
        run: bash tools/smoke.sh
      - name: tests that need no game data
        run: python3 tools/test_patch.py && python3 tools/test_settings.py

  linux-clang:
    name: linux (clang, x86-64)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - name: deps
        run: apt-get update && apt-get install -y cmake make clang gcc python3 pkg-config libvulkan-dev glslang-tools libsdl3-dev glslc
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPS2_RUNTIME_ONLY=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: build
        run: cmake --build build --target gsreplay -j$(nproc)
      - name: smoke test (binary loads)
        run: bash tools/smoke.sh
      - name: tests that need no game data
        run: python3 tools/test_patch.py && python3 tools/test_settings.py

  # ps2_vu.c falls back to its scalar path off x86 (see VU_SIMD). The smoke
  # test runs `gsreplay --novideo` on a missing capture to prove VU init
  # reaches the replay stage without SIGILL. It does not emulate the VU.
  linux-arm64:
    name: linux (clang, arm64)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - name: deps
        run: apt-get update && apt-get install -y cmake make clang gcc python3 pkg-config libvulkan-dev glslang-tools libsdl3-dev glslc
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPS2_RUNTIME_ONLY=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: build
        run: cmake --build build --target gsreplay -j$(nproc)
      - name: smoke test (binary loads)
        run: bash tools/smoke.sh
      - name: tests that need no game data
        run: python3 tools/test_patch.py && python3 tools/test_settings.py
